table:
  name: company_tags
  schema: public
configuration:
  custom_name: company_tags
object_relationships:
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
insert_permissions:
  # added_by comes from the JWT, never from the client.
  - role: user
    permission:
      check: {}
      set:
        added_by: x-hasura-User-Id
      columns:
        - company_id
        - tag_id
select_permissions:
  - role: user
    permission:
      columns:
        - company_id
        - tag_id
        - added_by
        - added_at
      filter: {}
delete_permissions:
  # Only a tag you added (decided 2026-10-29). Removing anyone's waits for an admin role.
  - role: user
    permission:
      filter:
        added_by:
          _eq: x-hasura-User-Id
