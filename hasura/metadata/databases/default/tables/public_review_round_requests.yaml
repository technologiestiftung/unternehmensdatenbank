table:
  name: review_round_requests
  schema: public
configuration:
  custom_name: review_round_requests
object_relationships:
  - name: round
    using:
      manual_configuration:
        remote_table:
          name: review_rounds
          schema: public
        column_mapping:
          round_id: id
insert_permissions:
  # #190: every logged-in person may ask for a round (no manager role yet, decided 2026-11-11); the DAG review_round_requests draws it. Status and result are the DAG's.
  - role: user
    permission:
      check: {}
      columns:
        - field_name
        - kind
        - source_key
        - size
        - mode
        - title
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - field_name
        - kind
        - source_key
        - size
        - mode
        - title
        - status
        - round_id
        - error
        - requested_at
        - done_at
      filter: {}
