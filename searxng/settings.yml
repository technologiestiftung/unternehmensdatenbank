# SearXNG configuration for unternehmensdatenbank
# https://docs.searxng.org/admin/settings/settings.html
use_default_settings: true

server:
  secret_key: "changeme_update_via_SEARXNG_SECRET_in_env"
  bind_address: "0.0.0.0:8080"
  image_proxy: false

search:
  safe_search: 0
  default_lang: "de-DE"
  formats:
    - html
    - json
