# Per-repo no-mistakes overrides. Optional: use /no-mistakes when `no-mistakes` is installed,
# otherwise the normal branch + PR flow (CLAUDE.md, "Guards and tests").
# Test settings are only honored from the default-branch (main) copy of this file.

# The free checks, in a throwaway container so the gate needs no local Python setup (the gate's
# worktree has no .venv, and Python 3.12 matches the Airflow image).
commands:
  test: >-
    docker run --rm -v "$PWD":/repo -w /repo -e RUFF_NO_CACHE=true -e PYTHONDONTWRITEBYTECODE=1
    python:3.12-slim sh -c "pip install -q --root-user-action=ignore ruff pytest -r airflow/requirements.txt
    && scripts/free_checks.sh"

test:
  instructions: |
    Run the configured test command only. It covers ruff, the unit tests and the six rule guards.
    Do not start the Docker stack, Airflow or any DAG, and never call a model or a search engine. If a change needs coverage, add a unit test under tests/unit/.
