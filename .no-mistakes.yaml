# Per-repo no-mistakes overrides. Optional: use /no-mistakes when `no-mistakes` is installed,
# otherwise the normal branch + PR flow (CLAUDE.md, "Guards and tests").
# Test settings are only honored from the default-branch (main) copy of this file.

# The free checks, in a throwaway container so the gate needs no local Python setup (the gate's
# worktree has no .venv, and Python 3.12 matches the Airflow image). The pinned-number tests are
# left out: they need the reference copy of the example data, which most machines do not have.
commands:
  test: >-
    docker run --rm -v "$PWD":/repo -w /repo -e RUFF_NO_CACHE=true -e PYTHONDONTWRITEBYTECODE=1
    python:3.12-slim sh -c "pip install -q --root-user-action=ignore ruff pytest -r airflow/requirements.txt
    && ruff check .
    && python -m pytest -q -p no:cacheprovider -m 'not integration'
    && python scripts/check_branch_classifier.py
    && python scripts/check_purpose_branch.py
    && python scripts/check_combined_discovery.py
    && python scripts/check_osm_match.py
    && python scripts/check_branch_observations.py"

test:
  instructions: |
    Run the configured test command only. It covers ruff, the unit tests and the five rule guards.
    Do not run tests/integration/ (pinned to one machine's example data), do not start the Docker
    stack, Airflow or any DAG, and never call a paid search API or a model (scripts that do are
    blocked by a hook for a reason). If a change needs coverage, add a unit test under tests/unit/.
