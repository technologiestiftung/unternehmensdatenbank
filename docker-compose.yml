x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
    args:
      AIRFLOW_BASE_IMAGE: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.0}
  image: unternehmensdatenbank-airflow:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    # Airflow's defaults are 5 + 10 overflow = 15 connections, and 15 is not enough here. The
    # api-server's DAG-run detail endpoint leaves a transaction open per request: measured
    # 2026-09-07, 15 sessions sat `idle in transaction` on `SELECT task_instance…` and
    # `SELECT dag_version…`, the oldest for 23 minutes, each waiting on ClientRead. Once all 15
    # are held every request blocks for the 30 s pool timeout and the UI stops answering — and
    # task heartbeats are PUTs to that same server, so three timeouts in a row make the supervisor
    # kill a running task. That is what ended two brave_search_discovery runs, at company 261 and
    # at company 70, with no traceback in either task log.
    #
    # 20 + 40 = 60 slots is four times the headroom, so watching a run page costs minutes instead
    # of killing it. It BUYS TIME and does not fix the leak, so it is only half of the change.
    #
    # The other half is server-side and is NOT in this file, because Postgres owns it — applied by
    # hand on 2026-09-07 and recorded here because that is the one place somebody will look:
    #
    #     ALTER ROLE airflow SET idle_in_transaction_session_timeout = '120s';
    #
    # Postgres then reaps an abandoned transaction itself rather than waiting for Airflow to close
    # it, so the pool recovers with no restart. It lives in `pg_roles.rolconfig`, survives a
    # container rebuild, and applies only to NEW sessions — bounce the api-server after changing
    # it. It is scoped to the `airflow` role, so the `app` role this project's own DAGs use is
    # untouched and still has no timeout. Undo with `ALTER ROLE airflow RESET
    # idle_in_transaction_session_timeout`. A fresh Postgres volume loses it.
    #
    # PRE_PING costs one `SELECT 1` per checkout and is what makes a reaped connection recover
    # quietly rather than surfacing as one error to whoever asked next.
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: ${AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE:-20}
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: ${AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW:-40}
    # No inner quotes on the default: `${VAR:-"True"}` interpolates the quote characters INTO the
    # value, giving Airflow the 6-character string `"True"` instead of a boolean, and
    # `getboolean` does not accept it.
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: ${AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING:-True}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "86400"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
    AIRFLOW_DATA_DIR: /opt/airflow/data
    OUTPUT_FILE: /opt/airflow/data/gewerbedaten.jsonl
    CHECKPOINT_FILE: /opt/airflow/data/gewerbedaten_checkpoint.json
    RESET_CHECKPOINT: ${RESET_CHECKPOINT:-false}
    ADRESSEN_CACHE_FILE: /opt/airflow/data/adressen_cache.json
    PG_DSN: host=postgres port=5432 dbname=${APP_DB_NAME:-unternehmensdatenbank} user=${APP_DB_USER:-app} password=${APP_DB_PASSWORD:-app}
    MAX_RECORDS: ${MAX_RECORDS:-0}
    WFS_PAGE_SIZE: ${WFS_PAGE_SIZE:-2000}
    WFS_START_INDEX: ${WFS_START_INDEX:-0}
    SKIP_GEOCODE: ${SKIP_GEOCODE:-false}
    SKIP_NAME_LOOKUP: ${SKIP_NAME_LOOKUP:-true}
    ADRESSEN_MAX_DIST_M: ${ADRESSEN_MAX_DIST_M:-60}
    OVERPASS_URL: ${OVERPASS_URL:-http://overpass/api/interpreter}
    ALLOW_PUBLIC_OVERPASS_FALLBACK: ${ALLOW_PUBLIC_OVERPASS_FALLBACK:-false}
    OVERPASS_RADIUS: ${OVERPASS_RADIUS:-80}
    OVERPASS_DELAY_S: ${OVERPASS_DELAY_S:-1.5}
    OVERPASS_WORKERS: ${OVERPASS_WORKERS:-6}
    NAME_MATCH_MIN_SCORE: ${NAME_MATCH_MIN_SCORE:-35}
    NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org/reverse}
    NOMINATIM_DELAY_S: ${NOMINATIM_DELAY_S:-2.0}
    DB_COMMIT_BATCH_SIZE: ${DB_COMMIT_BATCH_SIZE:-250}
    SOURCE_ENRICHMENT_BATCH_SIZE: ${SOURCE_ENRICHMENT_BATCH_SIZE:-50}
    # Skip companies whose register_status is not 'aktiv' — 56.4% of the Osnabrück table. Off by
    # default because it changes which companies every stage sees, and all published numbers were
    # measured unfiltered. See source_enrichment_common.ACTIVE_ONLY.
    DISCOVERY_ACTIVE_ONLY: ${DISCOVERY_ACTIVE_ONLY:-false}
    DISCOVERY_SKIP_RESOLVED_WEBSITE: ${DISCOVERY_SKIP_RESOLVED_WEBSITE:-false}
    ENABLE_MISTRAL_SEARCH_DISCOVERY: ${ENABLE_MISTRAL_SEARCH_DISCOVERY:-false}
    ENABLE_CLAUDE_SEARCH_DISCOVERY: ${ENABLE_CLAUDE_SEARCH_DISCOVERY:-false}
    MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    MISTRAL_MODEL: ${MISTRAL_MODEL:-magistral-small-2509}
    MISTRAL_SEARCH_TOOL: ${MISTRAL_SEARCH_TOOL:-web_search}
    MISTRAL_DISCOVERY_MAX_RESULTS: ${MISTRAL_DISCOVERY_MAX_RESULTS:-5}
    MISTRAL_REQUEST_DELAY_S: ${MISTRAL_REQUEST_DELAY_S:-3.0}
    MISTRAL_HTTP_TIMEOUT_S: ${MISTRAL_HTTP_TIMEOUT_S:-45}
    MISTRAL_HTTP_MAX_RETRIES: ${MISTRAL_HTTP_MAX_RETRIES:-5}
    MISTRAL_RETRY_MAX_WAIT_S: ${MISTRAL_RETRY_MAX_WAIT_S:-60}
    MISTRAL_PROGRESS_LOG_EVERY: ${MISTRAL_PROGRESS_LOG_EVERY:-10}
    MISTRAL_DISCOVERY_CHECKPOINT_FILE: ${MISTRAL_DISCOVERY_CHECKPOINT_FILE:-/opt/airflow/data/mistral_search_discovery_checkpoint.json}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
    CLAUDE_WEB_SEARCH_TOOL_TYPE: ${CLAUDE_WEB_SEARCH_TOOL_TYPE:-web_search_20250305}
    CLAUDE_API_BASE_URL: ${CLAUDE_API_BASE_URL:-https://api.anthropic.com/v1}
    CLAUDE_HTTP_TIMEOUT_S: ${CLAUDE_HTTP_TIMEOUT_S:-45}
    CLAUDE_HTTP_MAX_RETRIES: ${CLAUDE_HTTP_MAX_RETRIES:-5}
    CLAUDE_REQUEST_DELAY_S: ${CLAUDE_REQUEST_DELAY_S:-3.0}
    CLAUDE_RETRY_MAX_WAIT_S: ${CLAUDE_RETRY_MAX_WAIT_S:-60}
    CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-1200}
    CLAUDE_WEB_SEARCH_MAX_USES: ${CLAUDE_WEB_SEARCH_MAX_USES:-5}
    CLAUDE_MAX_PAUSE_TURNS: ${CLAUDE_MAX_PAUSE_TURNS:-3}
    CLAUDE_DISCOVERY_MAX_RESULTS: ${CLAUDE_DISCOVERY_MAX_RESULTS:-5}
    CLAUDE_PROGRESS_LOG_EVERY: ${CLAUDE_PROGRESS_LOG_EVERY:-10}
    CLAUDE_DISCOVERY_CHECKPOINT_FILE: ${CLAUDE_DISCOVERY_CHECKPOINT_FILE:-/opt/airflow/data/claude_search_discovery_checkpoint.json}
    ENABLE_OLLAMA_SEARCH_DISCOVERY: ${ENABLE_OLLAMA_SEARCH_DISCOVERY:-false}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    # OpenAI-compatible endpoint on the same server. It returns token counts, the native API
    # does not, so ac_measurement.py uses this one to compare a local model against Mistral.
    OLLAMA_OPENAI_BASE_URL: ${OLLAMA_OPENAI_BASE_URL:-http://ollama:11434/v1}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    OLLAMA_HTTP_TIMEOUT_S: ${OLLAMA_HTTP_TIMEOUT_S:-120}
    OLLAMA_HTTP_MAX_RETRIES: ${OLLAMA_HTTP_MAX_RETRIES:-3}
    OLLAMA_REQUEST_DELAY_S: ${OLLAMA_REQUEST_DELAY_S:-0.0}
    OLLAMA_RETRY_WAIT_S: ${OLLAMA_RETRY_WAIT_S:-5.0}
    OLLAMA_PROGRESS_LOG_EVERY: ${OLLAMA_PROGRESS_LOG_EVERY:-10}
    OLLAMA_DISCOVERY_CHECKPOINT_FILE: ${OLLAMA_DISCOVERY_CHECKPOINT_FILE:-/opt/airflow/data/ollama_search_discovery_checkpoint.json}
    SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
    SEARXNG_MAX_RESULTS: ${SEARXNG_MAX_RESULTS:-5}
    SEARXNG_TIMEOUT_S: ${SEARXNG_TIMEOUT_S:-15}
    SEARXNG_HTTP_MAX_RETRIES: ${SEARXNG_HTTP_MAX_RETRIES:-3}
    SEARXNG_RETRY_WAIT_S: ${SEARXNG_RETRY_WAIT_S:-2.0}
    SEARXNG_REQUEST_DELAY_S: ${SEARXNG_REQUEST_DELAY_S:-10.0}
    ENABLE_URL_DISCOVERY: ${ENABLE_URL_DISCOVERY:-false}
    URL_DISCOVERY_BATCH_SIZE: ${URL_DISCOVERY_BATCH_SIZE:-50}
    URL_DISCOVERY_CONCURRENCY: ${URL_DISCOVERY_CONCURRENCY:-5}
    URL_DISCOVERY_HTTP_TIMEOUT_S: ${URL_DISCOVERY_HTTP_TIMEOUT_S:-10}
    URL_DISCOVERY_REQUEST_DELAY_S: ${URL_DISCOVERY_REQUEST_DELAY_S:-0.5}
    URL_DISCOVERY_PROGRESS_LOG_EVERY: ${URL_DISCOVERY_PROGRESS_LOG_EVERY:-25}
    URL_DISCOVERY_CHECKPOINT_FILE: ${URL_DISCOVERY_CHECKPOINT_FILE:-/opt/airflow/data/url_discovery_checkpoint.json}
    ENABLE_OSM_DISCOVERY: ${ENABLE_OSM_DISCOVERY:-false}
    OSM_OVERPASS_URL: ${OSM_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
    OSM_DISCOVERY_TIMEOUT_S: ${OSM_DISCOVERY_TIMEOUT_S:-30}
    OSM_DISCOVERY_REQUEST_DELAY_S: ${OSM_DISCOVERY_REQUEST_DELAY_S:-1.0}
    OSM_DISCOVERY_BATCH_SIZE: ${OSM_DISCOVERY_BATCH_SIZE:-50}
    OSM_DISCOVERY_PROGRESS_LOG_EVERY: ${OSM_DISCOVERY_PROGRESS_LOG_EVERY:-25}
    OSM_DISCOVERY_CHECKPOINT_FILE: ${OSM_DISCOVERY_CHECKPOINT_FILE:-/opt/airflow/data/osm_discovery_checkpoint.json}
    OSM_MIN_MATCH_SCORE: ${OSM_MIN_MATCH_SCORE:-0.65}
    # Shared extraction model for the search-API providers. Deliberately NOT MISTRAL_MODEL,
    # which is a reasoning model and would burn output tokens on a mechanical extraction.
    EXTRACT_MODEL: ${EXTRACT_MODEL:-ministral-8b-latest}
    EXTRACT_MAX_CHARS: ${EXTRACT_MAX_CHARS:-20000}
    EXTRACT_HTTP_TIMEOUT_S: ${EXTRACT_HTTP_TIMEOUT_S:-90}
    EXTRACT_HTTP_MAX_RETRIES: ${EXTRACT_HTTP_MAX_RETRIES:-3}
    EXTRACT_RETRY_MAX_WAIT_S: ${EXTRACT_RETRY_MAX_WAIT_S:-30}
    EXTRACT_PRICE_IN: ${EXTRACT_PRICE_IN:-0}
    EXTRACT_PRICE_OUT: ${EXTRACT_PRICE_OUT:-0}
    MISTRAL_API_BASE_URL: ${MISTRAL_API_BASE_URL:-https://api.mistral.ai/v1}
    # Impressum probing: works around fetch_impressum returning homepages (0/8 register
    # numbers found vs 3/8 when the explicit paths are probed).
    IMPRINT_PROBE_ENABLED: ${IMPRINT_PROBE_ENABLED:-true}
    IMPRINT_PROBE_PATHS: ${IMPRINT_PROBE_PATHS:-/impressum/,/impressum,/imprint,/impressum.html}
    IMPRINT_PROBE_TIMEOUT_S: ${IMPRINT_PROBE_TIMEOUT_S:-12}
    LLM_WEBSITE_CONF_CAP: ${LLM_WEBSITE_CONF_CAP:-0.34}
    # Off: the register number in the query pulls results toward aggregators and directories.
    # Measured 21 vs 25 provable websites per 100 companies. Scorer use is unaffected.
    SEARCH_QUERY_INCLUDE_REGISTER_NUMBER: ${SEARCH_QUERY_INCLUDE_REGISTER_NUMBER:-false}
    # Parallel Search MCP — free and anonymous, so the key is optional and only raises limits.
    ENABLE_PARALLEL_SEARCH_DISCOVERY: ${ENABLE_PARALLEL_SEARCH_DISCOVERY:-false}
    PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
    PARALLEL_MCP_URL: ${PARALLEL_MCP_URL:-https://search.parallel.ai/mcp}
    PARALLEL_MCP_TIMEOUT_S: ${PARALLEL_MCP_TIMEOUT_S:-120}
    PARALLEL_QUOTA_GIVEUP_AFTER: ${PARALLEL_QUOTA_GIVEUP_AFTER:-3}
    PARALLEL_MAX_CANDIDATES: ${PARALLEL_MAX_CANDIDATES:-5}
    PARALLEL_PROGRESS_LOG_EVERY: ${PARALLEL_PROGRESS_LOG_EVERY:-10}
    PARALLEL_DISCOVERY_CHECKPOINT_FILE: ${PARALLEL_DISCOVERY_CHECKPOINT_FILE:-/opt/airflow/data/parallel_search_discovery_checkpoint.json}
    # Exa — returns page contents with the search, and reports costDollars per request.
    ENABLE_EXA_SEARCH_DISCOVERY: ${ENABLE_EXA_SEARCH_DISCOVERY:-false}
    EXA_API_KEY: ${EXA_API_KEY:-}
    EXA_API_BASE_URL: ${EXA_API_BASE_URL:-https://api.exa.ai}
    EXA_SEARCH_TYPE: ${EXA_SEARCH_TYPE:-auto}
    EXA_NUM_RESULTS: ${EXA_NUM_RESULTS:-8}
    # highlights | text | both. Highlights are query-biased, so owner extraction may want text.
    EXA_CONTENT_MODE: ${EXA_CONTENT_MODE:-highlights}
    EXA_TEXT_MAX_CHARS: ${EXA_TEXT_MAX_CHARS:-4000}
    EXA_HTTP_TIMEOUT_S: ${EXA_HTTP_TIMEOUT_S:-45}
    EXA_HTTP_MAX_RETRIES: ${EXA_HTTP_MAX_RETRIES:-3}
    EXA_RETRY_MAX_WAIT_S: ${EXA_RETRY_MAX_WAIT_S:-30}
    EXA_REQUEST_DELAY_S: ${EXA_REQUEST_DELAY_S:-0.15}
    EXA_MAX_CANDIDATES: ${EXA_MAX_CANDIDATES:-5}
    EXA_PROGRESS_LOG_EVERY: ${EXA_PROGRESS_LOG_EVERY:-10}
    EXA_DISCOVERY_CHECKPOINT_FILE: ${EXA_DISCOVERY_CHECKPOINT_FILE:-/opt/airflow/data/exa_search_discovery_checkpoint.json}
    # Brave — snippets only, no page text, and q is capped at 400 chars / 50 words.
    ENABLE_BRAVE_SEARCH_DISCOVERY: ${ENABLE_BRAVE_SEARCH_DISCOVERY:-false}
    BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    BRAVE_API_URL: ${BRAVE_API_URL:-https://api.search.brave.com/res/v1/web/search}
    BRAVE_COUNTRY: ${BRAVE_COUNTRY:-DE}
    BRAVE_SEARCH_LANG: ${BRAVE_SEARCH_LANG:-de}
    BRAVE_COUNT: ${BRAVE_COUNT:-10}
    BRAVE_HTTP_TIMEOUT_S: ${BRAVE_HTTP_TIMEOUT_S:-30}
    BRAVE_HTTP_MAX_RETRIES: ${BRAVE_HTTP_MAX_RETRIES:-3}
    BRAVE_RETRY_MAX_WAIT_S: ${BRAVE_RETRY_MAX_WAIT_S:-30}
    BRAVE_REQUEST_DELAY_S: ${BRAVE_REQUEST_DELAY_S:-0.1}
    BRAVE_MAX_CANDIDATES: ${BRAVE_MAX_CANDIDATES:-5}
    BRAVE_PROGRESS_LOG_EVERY: ${BRAVE_PROGRESS_LOG_EVERY:-10}
    BRAVE_DISCOVERY_CHECKPOINT_FILE: ${BRAVE_DISCOVERY_CHECKPOINT_FILE:-/opt/airflow/data/brave_search_discovery_checkpoint.json}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/data:/opt/airflow/data
    # Read-only so an ad-hoc measurement script can import the DAG modules it measures,
    # without the dag-processor ever parsing it as a DAG.
    - ./scripts:/opt/airflow/scripts:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:-postgres}
      POSTGRES_DB: postgres
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      APP_DB_NAME: ${APP_DB_NAME:-unternehmensdatenbank}
      APP_DB_USER: ${APP_DB_USER:-app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "${PGADMIN_PORT:-5051}:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  overpass:
    image: wiktorn/overpass-api:latest
    profiles:
      - geo
    restart: unless-stopped
    ports:
      - "${OVERPASS_PORT:-12345}:80"
    environment:
      OVERPASS_META: "yes"
      OVERPASS_MODE: ${OVERPASS_MODE:-init}
      OVERPASS_PLANET_URL: ${OVERPASS_PLANET_URL:-https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf}
      OVERPASS_DIFF_URL: ${OVERPASS_DIFF_URL:-https://download.geofabrik.de/europe/germany/berlin-updates/}
      OVERPASS_RULES_LOAD: "10"
      OVERPASS_SPACE: ${OVERPASS_SPACE:-2000000000}
      OVERPASS_MAX_TIMEOUT: "1000"
      # Geofabrik only provides PBF; osmium converts it to bz2 in-place before init_osm3s.sh runs.
      # -F pbf forces input format (osmium would otherwise misread the .bz2 extension).
      # -F pbf: force input format (osmium would misread the .bz2 extension on a PBF file).
      # chmod: /db is created 700 by the overpass user; nginx needs +x to reach the dispatcher socket.
      OVERPASS_PLANET_PREPROCESS: "osmium cat /db/planet.osm.bz2 -F pbf -f osm.bz2 -o /tmp/planet_converted.osm.bz2 && mv /tmp/planet_converted.osm.bz2 /db/planet.osm.bz2 && chmod o+x /db"
    volumes:
      - overpass-db:/db

  nominatim:
    image: mediagis/nominatim:4.4
    profiles:
      - geocoding
    restart: unless-stopped
    ports:
      - "${NOMINATIM_PORT:-8081}:8080"
    environment:
      PBF_URL: ${OVERPASS_PLANET_URL:-https://download.geofabrik.de/europe/germany/berlin-latest.osm.pbf}
      REPLICATION_URL: ${OVERPASS_DIFF_URL:-https://download.geofabrik.de/europe/germany/berlin-updates/}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
    volumes:
      - nominatim-db:/var/lib/postgresql/14/main
    shm_size: "1gb"

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --role Admin \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Airflow \
          --lastname Admin \
          --email admin@example.com || true

  airflow-apiserver:
    <<: *airflow-common
    command:
      - api-server
      - --apps
      - core,execution
    ports:
      - "${AIRFLOW_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    command:
      - bash
      - -c
      - airflow

  flyway:
    image: flyway/flyway:12
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql
    command:
      - -url=jdbc:postgresql://postgres:5432/${APP_DB_NAME:-unternehmensdatenbank}
      - -user=${APP_DB_USER:-app}
      - -password=${APP_DB_PASSWORD:-app}
      - -locations=filesystem:/flyway/sql
      - -connectRetries=60
      - migrate

  searxng:
    image: searxng/searxng:latest
    profiles:
      - llm
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-changeme_update_this}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles:
      - llm
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Uncomment to enable NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres-data:
  pgadmin-data:
  overpass-db:
  nominatim-db:
  ollama-models:
