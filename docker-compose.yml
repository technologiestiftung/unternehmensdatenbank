x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
    args:
      AIRFLOW_BASE_IMAGE: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.2.0}
  image: unternehmensdatenbank-airflow:local
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    # Airflow's defaults are 5 + 10 overflow = 15 connections, and 15 is not enough here. The
    # api-server's DAG-run detail endpoint leaves a transaction open per request: measured
    # 2026-09-07, 15 sessions sat `idle in transaction` on `SELECT task_instance…` and
    # `SELECT dag_version…`, the oldest for 23 minutes, each waiting on ClientRead. Once all 15
    # are held every request blocks for the 30 s pool timeout and the UI stops answering — and
    # task heartbeats are PUTs to that same server, so three timeouts in a row make the supervisor
    # kill a running task. That is what ended two brave_search_discovery runs, at company 261 and
    # at company 70, with no traceback in either task log.
    #
    # 20 + 40 = 60 slots is four times the headroom, so watching a run page costs minutes instead
    # of killing it. It BUYS TIME and does not fix the leak, so it is only half of the change.
    #
    # The other half is server-side and is NOT in this file, because Postgres owns it — applied by
    # hand on 2026-09-07 and recorded here because that is the one place somebody will look:
    #
    #     ALTER ROLE airflow SET idle_in_transaction_session_timeout = '120s';
    #
    # Postgres then reaps an abandoned transaction itself rather than waiting for Airflow to close
    # it, so the pool recovers with no restart. It lives in `pg_roles.rolconfig`, survives a
    # container rebuild, and applies only to NEW sessions — bounce the api-server after changing
    # it. It is scoped to the `airflow` role, so the `app` role this project's own DAGs use is
    # untouched and still has no timeout. Undo with `ALTER ROLE airflow RESET
    # idle_in_transaction_session_timeout`. A fresh Postgres volume loses it.
    #
    # PRE_PING costs one `SELECT 1` per checkout and is what makes a reaped connection recover
    # quietly rather than surfacing as one error to whoever asked next.
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: ${AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE:-20}
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: ${AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW:-40}
    # No inner quotes on the default: `${VAR:-"True"}` interpolates the quote characters INTO the
    # value, giving Airflow the 6-character string `"True"` instead of a boolean, and
    # `getboolean` does not accept it.
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: ${AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING:-True}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "86400"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg
    AIRFLOW_DATA_DIR: /opt/airflow/data
    # The writer role, like a DAG on the Data Hub: read/write rows, no DDL. Host scripts still
    # default to the owner `app`; see docs/datahub-emulation.md.
    PG_DSN: host=postgres port=5432 dbname=${APP_DB_NAME:-unternehmensdatenbank} user=${APP_DB_WRITER_USER:-writer} password=${APP_DB_WRITER_PASSWORD:-writer}
    SOURCE_ENRICHMENT_BATCH_SIZE: ${SOURCE_ENRICHMENT_BATCH_SIZE:-50}
    # The company corpus (#61): every page and text read, in S3. The `s3` service is in the `datahub`
    # profile; without it the DAGs log one warning and work without the store.
    CORPUS_S3_ENDPOINT: ${CORPUS_S3_ENDPOINT:-s3:9000}
    CORPUS_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-localaccess}
    CORPUS_S3_SECRET_KEY: ${S3_SECRET_KEY:-localsecret}
    CORPUS_S3_BUCKET: ${CORPUS_S3_BUCKET:-company-corpus}
    # Skip companies whose register_status is not 'active' (153,915 of the 296,486 Berlin companies).
    # See source_enrichment_common.ACTIVE_ONLY.
    DISCOVERY_ACTIVE_ONLY: ${DISCOVERY_ACTIVE_ONLY:-true}
    DISCOVERY_SKIP_RESOLVED_WEBSITE: ${DISCOVERY_SKIP_RESOLVED_WEBSITE:-false}
    WEBSITE_DISCOVERY_BATCH_SIZE: ${WEBSITE_DISCOVERY_BATCH_SIZE:-50}
    WEBSITE_DISCOVERY_OSM: ${WEBSITE_DISCOVERY_OSM:-false}
    WEBSITE_DISCOVERY_WORKERS: ${WEBSITE_DISCOVERY_WORKERS:-8}
    WEBSITE_DISCOVERY_RECHECK_DAYS: ${WEBSITE_DISCOVERY_RECHECK_DAYS:-90}
    WEBSITE_CONTACTS_BATCH_SIZE: ${WEBSITE_CONTACTS_BATCH_SIZE:-50}
    WEBSITE_KEYWORDS_BATCH_SIZE: ${WEBSITE_KEYWORDS_BATCH_SIZE:-50}
    TECHNOLOGY_FIELD_BATCH_SIZE: ${TECHNOLOGY_FIELD_BATCH_SIZE:-50}
    TECHNOLOGY_FIELD_MIN_COMPANIES: ${TECHNOLOGY_FIELD_MIN_COMPANIES:-500}
    MANAGER_NER_MIN_COMPANIES: ${MANAGER_NER_MIN_COMPANIES:-30}
    MANAGER_NER_EPOCHS: ${MANAGER_NER_EPOCHS:-10}
    # Website discovery building blocks (airflow/dags/enrichment).
    URL_DISCOVERY_HTTP_TIMEOUT_S: ${URL_DISCOVERY_HTTP_TIMEOUT_S:-10}
    OSM_OVERPASS_URL: ${OSM_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
    OSM_DISCOVERY_TIMEOUT_S: ${OSM_DISCOVERY_TIMEOUT_S:-30}
    OSM_DISCOVERY_REQUEST_DELAY_S: ${OSM_DISCOVERY_REQUEST_DELAY_S:-1.0}
    OSM_MIN_MATCH_SCORE: ${OSM_MIN_MATCH_SCORE:-0.65}
    # Impressum probing: works around fetch_impressum returning homepages (0/8 register
    # numbers found vs 3/8 when the explicit paths are probed).
    IMPRINT_PROBE_ENABLED: ${IMPRINT_PROBE_ENABLED:-true}
    IMPRINT_PROBE_PATHS: ${IMPRINT_PROBE_PATHS:-/impressum/,/impressum,/imprint,/impressum.html}
    IMPRINT_PROBE_TIMEOUT_S: ${IMPRINT_PROBE_TIMEOUT_S:-12}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/data:/opt/airflow/data
    # Read-only so an ad-hoc measurement script can import the DAG modules it measures,
    # without the dag-processor ever parsing it as a DAG.
    - ./scripts:/opt/airflow/scripts:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    # Postgres 15 + PostGIS + pgvector, as on the Data Hub. See docs/datahub-emulation.md.
    build: ./postgres
    image: unternehmensdatenbank-postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:-postgres}
      POSTGRES_DB: postgres
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      APP_DB_NAME: ${APP_DB_NAME:-unternehmensdatenbank}
      APP_DB_USER: ${APP_DB_USER:-app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      APP_DB_STAGING_NAME: ${APP_DB_STAGING_NAME:-unternehmensdatenbank_staging}
      APP_DB_WRITER_USER: ${APP_DB_WRITER_USER:-writer}
      APP_DB_WRITER_PASSWORD: ${APP_DB_WRITER_PASSWORD:-writer}
      APP_DB_READER_USER: ${APP_DB_READER_USER:-reader}
      APP_DB_READER_PASSWORD: ${APP_DB_READER_PASSWORD:-reader}
      KEYCLOAK_DB_NAME: keycloak
      KEYCLOAK_DB_USER: keycloak
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      HASURA_DB_NAME: hasura
      HASURA_DB_USER: hasura
      HASURA_DB_PASSWORD: ${HASURA_DB_PASSWORD:-hasura}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # A new volume, not `postgres-data`: a Postgres 16 data directory cannot be opened by 15.
      # The old volume is left in place; docs/datahub-emulation.md has the copy-over steps.
      - postgres15-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
    ports:
      - "${PGADMIN_PORT:-5051}:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --role Admin \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Airflow \
          --lastname Admin \
          --email admin@example.com || true

  airflow-apiserver:
    <<: *airflow-common
    command:
      - api-server
      - --apps
      - core,execution
    ports:
      - "${AIRFLOW_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    command:
      - bash
      - -c
      - airflow

  flyway:
    image: flyway/flyway:12
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql
    command:
      - -url=jdbc:postgresql://postgres:5432/${APP_DB_NAME:-unternehmensdatenbank}
      - -user=${APP_DB_USER:-app}
      - -password=${APP_DB_PASSWORD:-app}
      - -placeholders.writer_role=${APP_DB_WRITER_USER:-writer}
      - -placeholders.reader_role=${APP_DB_READER_USER:-reader}
      - -locations=filesystem:/flyway/sql
      - -connectRetries=60
      - migrate

  # --- Data Hub emulation: the platform services the hub runs for us ---------------------------
  # Profile `datahub`. Versions follow what the hub runs where known; see docs/datahub-emulation.md.

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles:
      - datahub
    command: start-dev --import-realm --http-port=8080
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # The browser and an app on the host both reach Keycloak here, so tokens carry this issuer.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    # The image has no curl; bash's /dev/tcp asks the management port's readiness endpoint.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      # The first start creates Keycloak's schema and takes minutes.
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  hasura:
    # cli-migrations-v3 applies ./hasura/metadata on every start, so the metadata lives in git.
    image: hasura/graphql-engine:v2.51.3.cli-migrations-v3
    profiles:
      - datahub
    environment:
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD:-hasura}@postgres:5432/hasura
      # Hasura reads as the reader role; V1__baseline grants it INSERT on company_comments and INSERT, UPDATE on extraction_feedback, nothing else.
      HASURA_UDB_DATABASE_URL: postgres://${APP_DB_READER_USER:-reader}:${APP_DB_READER_PASSWORD:-reader}@postgres:5432/${APP_DB_NAME:-unternehmensdatenbank}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-local-admin-secret}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      # Keycloak's realm roles become Hasura roles; every authenticated user defaults to `user`.
      HASURA_GRAPHQL_JWT_SECRET: >-
        {"type":"RS256","jwk_url":"http://keycloak:8080/realms/datahub/protocol/openid-connect/certs",
        "claims_map":{"x-hasura-allowed-roles":{"path":"$$.realm_access.roles"},
        "x-hasura-default-role":{"path":"$$.hasura_default_role","default":"user"},
        "x-hasura-user-id":{"path":"$$.sub"}}}
    ports:
      - "${HASURA_PORT:-8090}:8080"
    volumes:
      - ./hasura/metadata:/hasura-metadata:ro
    depends_on:
      postgres:
        condition: service_healthy
      # Hasura exits when it cannot fetch Keycloak's signing keys, so it waits for a ready Keycloak.
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  s3:
    # RustFS, not MinIO: MinIO stopped publishing images, and RustFS is a CIVITAS/CORE add-on that
    # speaks the same S3 API. The company corpus (#61, enrichment.corpus) keeps its texts here.
    image: rustfs/rustfs:1.0.4
    profiles:
      - datahub
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-localaccess}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-localsecret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  postgres15-data:
  s3-data:
  pgadmin-data:
