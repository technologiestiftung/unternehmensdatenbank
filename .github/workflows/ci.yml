name: CI and staging image

# Pull request:  checks.
# Push to main:  checks, then the STAGING images :main and :sha-<short>: migrations and pipelines.
# Production images come only from release.yml.

on:
  pull_request:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  staging-image:
    if: github.event_name == 'push'
    needs: checks
    concurrency:
      group: staging-image-${{ matrix.image.name }}
      cancel-in-progress: false
    strategy:
      matrix:
        image:
          - { name: migrations, context: db, file: db/Dockerfile }
          - { name: pipelines, context: airflow, file: airflow/pipelines.Dockerfile }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
